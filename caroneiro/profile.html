<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Caroneiro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <h1>Caroneiro</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="profile.html" class="active">Meu Perfil</a></li>
                <li><a href="#" id="logout-btn">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main class="profile-container">
        <div class="profile-header">
            <div class="profile-picture">
                <img src="assets/images/default-avatar.png" alt="Foto de perfil" id="profile-img">
                <button class="edit-btn" id="change-photo-btn">Alterar foto</button>
            </div>
            <div class="profile-info">
                <h1 id="profile-name">Nome do Viajante</h1>
                <p id="profile-bio">Biografia do viajante...</p>
                <div class="profile-stats">
                    <div class="stat">
                        <span class="stat-number" id="trips-count">0</span>
                        <span class="stat-label">Viagens</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="friends-count">0</span>
                        <span class="stat-label">Amigos</span>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn-primary" id="edit-profile-btn">Editar Perfil</button>
                </div>
            </div>
        </div>

        <div class="profile-content">
            <div class="profile-section">
                <h2>Viagens Realizadas</h2>
                <div class="trips-list" id="past-trips">
                    <!-- Viagens passadas serão carregadas aqui -->
                </div>
            </div>

            <div class="profile-section">
                <h2>Destinos Desejados</h2>
                <div class="destinations-list" id="wishlist">
                    <!-- Destinos desejados serão carregados aqui -->
                </div>
            </div>
        </div>

        <!-- Modal de Edição de Perfil -->
        <div class="modal" id="edit-profile-modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Editar Perfil</h2>
                <form id="edit-profile-form">
                    <div class="form-group">
                        <label for="edit-name">Nome</label>
                        <input type="text" id="edit-name" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-bio">Biografia</label>
                        <textarea id="edit-bio" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-interests">Interesses de Viagem</label>
                        <input type="text" id="edit-interests" placeholder="Separados por vírgula">
                    </div>
                    <button type="submit" class="btn-primary">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/profile.js"></script>
</body>
</html>
